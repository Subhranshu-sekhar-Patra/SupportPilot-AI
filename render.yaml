# ============================================================
# SupportPilot AI — Render.com Blueprint Specification
# Free Tier Deployment for FastAPI Backend
# ============================================================
services:
  - type: web
    name: supportpilot-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        placeholder: "postgresql+asyncpg://postgres:[PASSWORD]@[HOST]:5432/postgres"
      - key: DATABASE_URL_SYNC
        placeholder: "postgresql://postgres:[PASSWORD]@[HOST]:5432/postgres"
      - key: GEMINI_API_KEY
        placeholder: "Your Google Gemini API Key"
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_BACKEND
        value: "local"
      - key: CHROMA_PERSIST_DIR
        value: "./chroma_data"
